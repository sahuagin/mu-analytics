name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mirrors `just ci` (ruff format + lint, ty, unittest) + the verify-claims gate.
# config.toml is gitignored; the modules fall back to config.example.toml, and the
# tests are hermetic (synthetic event-log fixtures), so no real data is needed.
#
# Every tool and dependency version comes from uv.lock (`uv sync --frozen`), so CI
# runs what the lockfile pins and nothing newer: unpinned installs have turned main
# red with no code change twice (ty 2026-08, duckdb 2.0 2026-11). Python 3.12 is
# the host's interpreter; requires-python (3.11) stays the compatibility floor.
# duckdb is fenced from `uv sync` by [tool.uv] no-install-package (no FreeBSD
# wheel on PyPI), so each job installs the locked duckdb version explicitly.
env:
  UV_PYTHON: "3.12"

jobs:
  lint:
    name: ruff (format + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .

  typecheck:
    name: ty check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen --extra dev
      - name: Install the locked duckdb
        run: uv pip install "duckdb==$(uv run --no-sync python scripts/locked-version.py duckdb)"
      - run: uv run --no-sync ty check

  test:
    name: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - name: Install the locked duckdb
        run: uv pip install "duckdb==$(uv run --no-sync python scripts/locked-version.py duckdb)"
      - run: uv run --no-sync python -m unittest discover -s tests -v

  verify-claims:
    name: verify-claims (per-commit)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run verify-claims over PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          commits=$(git rev-list --reverse --no-merges "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "$commits" ]; then
            echo "verify-claims: no non-merge commits in range"; exit 0
          fi
          rc=0
          for c in $commits; do scripts/verify-claims.sh "$c" || rc=$?; done
          exit "$rc"
